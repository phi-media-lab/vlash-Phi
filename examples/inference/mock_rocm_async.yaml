# VLASH async inference configuration for local ROCm validation without robot hardware

robot:
  type: mock_robot
  id: local_mock_robot
  observation_state_dim: 8
  action_dim: 7
  cameras:
    wrist:
      type: mock
      width: 640
      height: 480
      fps: 30

policy:
  path: /home/amd/.cache/vlash/models/vlash-pi05-libero-async5
  n_action_steps: 32
  compile_model: true
  device: cuda
  fuse_qkv: false
  fuse_gate_up: false

single_task: "move the mock arm to the goal pose"

camera_feature_map:
  image: wrist
  wrist_image: wrist

fps: 5
control_time_s: 2
display_data: false
play_sounds: false
action_quant_ratio: 2
inference_overlap_steps: 4

runtime_stats_output: outputs/mock_runtime/mock_rocm_async_stats.json
